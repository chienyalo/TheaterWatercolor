<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>劇院黃昏・完成版</title><style>*{box-sizing:border-box}body{margin:0;background:#eae4d9;color:#443e36;font-family:system-ui,sans-serif}main{max-width:1400px;margin:auto;padding:26px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{font-size:23px;font-weight:500;margin:0}p,footer{color:#7c6c5b;font-size:12px;line-height:1.7}nav{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;font-size:13px;color:inherit;border:1px solid #cdbfae;border-radius:24px;background:#faf6ee;padding:10px 16px;cursor:pointer}button:hover{background:white}button:focus-visible,input:focus-visible{outline:2px solid #886e56;outline-offset:4px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:24px;margin-top:24px}canvas{width:100%;height:auto;display:block;background:#faf6ed;box-shadow:0 14px 40px #5541281c}aside{background:#f5efe4;border:1px solid #d5c7b5;border-radius:12px;padding:18px}aside label{display:block;margin:18px 0;font-size:12px}label span{display:flex;justify-content:space-between}output{color:#8d735b}input{accent-color:#8e7051}aside input{width:100%;margin-top:8px}aside button{width:100%}footer{display:flex;justify-content:space-between;gap:14px;margin-top:14px}.timeline{display:flex;align-items:center;gap:12px;font-size:12px;color:#7c6c5b;margin-top:16px}#seek{flex:1}aside p{margin-top:0}@media(max-width:900px){.workspace{grid-template-columns:1fr}aside{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}aside p,aside button{grid-column:1/-1}}@media(max-width:460px){main{padding:15px}aside{grid-template-columns:1fr}footer{flex-wrap:wrap}}:fullscreen{background:#f8f4eb;display:flex;align-items:center;justify-content:center}:fullscreen canvas{max-height:95vh;width:auto;max-width:98vw;box-shadow:none}aside details{margin-top:18px}aside summary{font-size:12px;cursor:pointer}.compare-link{font:inherit;font-size:13px;border:1px solid #cdbfae;border-radius:24px;background:#faf6ee;padding:10px 16px;color:inherit;text-decoration:none;display:inline-flex;align-items:center}.compare-link:focus-visible{outline:2px solid #886e56;outline-offset:4px}</style><main><header><div><h1>劇院黃昏 / THEATER AT DUSK</h1><p>劇院、暖光與水池倒影 · 墨線水彩精細重構</p></div><nav><button id="new">換一版筆觸</button><button id="replay">從墨線重播</button><button id="pause">暫停</button><button id="finish">看完成作品</button><button id="save">下載 PNG</button><button id="fullscreen">全螢幕欣賞</button><a class="compare-link" href="review/compare.html" target="_blank" rel="noopener">局部對照</a></nav></header><div class="workspace"><section><canvas id="art" width="1200" height="800" aria-label="程式逐筆描繪的劇院、街道人物與水池倒影墨線水彩作品"></canvas><div class="timeline">作畫進度<input id="seek" type="range" min="0" max="1000" value="0" aria-label="作畫進度"><output id="progress">0%</output></div><footer><span id="status" role="status">逐筆墨線</span><span>劇院・暖光・一池夜色</span></footer></section><aside><p>調整參數會保留構圖與作畫進度。預設參數以參考圖為準；調整會改變筆觸與色彩效果。</p><label><span>墨線粗細<output id="lineWidth-value"></output></span><input id="lineWidth" type="range" min="0.4" max="3" step="0.1" value="1"></label><label><span>墨線深淺<output id="ink-value"></output></span><input id="ink" type="range" min="0.15" max="1.5" step="0.05" value="0.95"></label><label><span>線條抖動<output id="jitter-value"></output></span><input id="jitter" type="range" min="0" max="3" step="0.1" value="0.9"></label><label><span>重描深度<output id="retrace-value"></output></span><input id="retrace" type="range" min="0" max="2" step="0.1" value="0.6"></label><label><span>水彩濃度<output id="wash-value"></output></span><input id="wash" type="range" min="0.3" max="2" step="0.05" value="1.15"></label><label><span>濕邊起伏<output id="edge-value"></output></span><input id="edge" type="range" min="0" max="2.5" step="0.1" value="1"></label><label><span>色塊留白<output id="whiteSpace-value"></output></span><input id="whiteSpace" type="range" min="0" max="65" step="5" value="18"></label><label><span>紙張與顏料顆粒<output id="grain-value"></output></span><input id="grain" type="range" min="0" max="3" step="0.1" value="1"></label><label><span>倒影濃度<output id="reflection-value"></output></span><input id="reflection" type="range" min="0" max="1.5" step="0.05" value="0.75"></label><label><span>街景細節<output id="people-value"></output></span><input id="people" type="range" min="10" max="150" step="5" value="120"></label><label><span>紙面濕度<output id="water-value"></output></span><input id="water" type="range" min="0" max="1" step="0.05" value="0.55"></label><label><span>播放速度<output id="speed-value"></output></span><input id="speed" type="range" min="0.5" max="4" step="0.5" value="1"></label><label><span>作畫時間<output id="duration-value"></output></span><input id="duration" type="range" min="30" max="180" step="15" value="90"></label><button id="reset">恢復預設參數</button><details><summary>作品與技法</summary><p>由參考圖分析連通色區與墨線，轉為向量筆觸重建。依天空、樓群、劇院、街景及倒影安排繪製；作畫順序是推定的。主畫面不載入原圖，可離線播放。</p></details></aside></div></main><script src="pigments.js"></script><script src="reconstruction.js"></script></html>
