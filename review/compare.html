<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>劇院水彩・局部對照</title><style>*{box-sizing:border-box}body{background:#eee8de;color:#493f34;font-family:system-ui;margin:0}main{max-width:1180px;padding:24px;margin:auto}h1{font-size:23px;font-weight:500;margin:0}h2{font-size:18px;font-weight:500}h3{font-size:13px;font-weight:500}p{font-size:12px;color:#81705d;line-height:1.8}.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}.crop{width:100%;position:relative;overflow:hidden;background:#faf7ed}.crop img{position:absolute;max-width:none}section{margin:32px 0}header{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}select,a{font:inherit;font-size:13px;padding:10px 16px;background:#faf6ed;color:inherit;border:1px solid #cabba7;border-radius:20px;text-decoration:none}label{font-size:12px;display:flex;align-items:center;gap:10px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}@media(max-width:700px){main{padding:15px}.pair{grid-template-columns:1fr}}</style><main><header><div><h1>劇院黃昏・局部對照</h1><p>相同位置、相同裁切範圍，檢視構圖與筆觸。</p></div><a href="../index.html">返回作畫工具</a></header><div class="controls"><label>重構版本<select id="version"><option value="vector">向量精細重建</option><option value="7">手工重構第七輪</option><option value="6">第六輪</option><option value="4">第四輪</option><option value="2">第二輪</option><option value="1">第一輪</option></select></label></div><section id="region-0"><h2>劇院曲面與窗光</h2><p>對照曲面轉折、窗格透視、灰紫牆面及暖黃窗光。</p><div class="pair"><article><h3>參考圖</h3><div class="crop" data-x="710" data-y="40" data-w="720" data-h="520"><img src="reference.png" alt="劇院曲面與窗光的參考圖" class="reference"></div></article><article><h3>程序重構</h3><div class="crop" data-x="710" data-y="40" data-w="720" data-h="520"><img src="vector-latest.png" alt="劇院曲面與窗光的程序重構" class="painting"></div></article></div></section><section id="region-1"><h2>高樓與街景</h2><p>對照屋頂窗光、灰藍立面、樹木層次和人物比例。</p><div class="pair"><article><h3>參考圖</h3><div class="crop" data-x="0" data-y="75" data-w="490" data-h="505"><img src="reference.png" alt="高樓與街景的參考圖" class="reference"></div></article><article><h3>程序重構</h3><div class="crop" data-x="0" data-y="75" data-w="490" data-h="505"><img src="vector-latest.png" alt="高樓與街景的程序重構" class="painting"></div></article></div></section><section id="region-2"><h2>水池倒影</h2><p>對照反光變形、深藍灰疊色、燈光與紙白。</p><div class="pair"><article><h3>參考圖</h3><div class="crop" data-x="470" data-y="560" data-w="990" data-h="445"><img src="reference.png" alt="水池倒影的參考圖" class="reference"></div></article><article><h3>程序重構</h3><div class="crop" data-x="470" data-y="560" data-w="990" data-h="445"><img src="vector-latest.png" alt="水池倒影的程序重構" class="painting"></div></article></div></section><p>參考圖片僅用於這個對照頁。新版先從參考圖抽取墨線與連通色區，再以向量筆觸繪製。作畫工具不載入原始圖片；推定的作畫順序仍不等於原作者的實際過程。</p></main><script>function resize(){document.querySelectorAll('.crop').forEach(box=>{const scale=box.clientWidth/Number(box.dataset.w),img=box.querySelector('img');box.style.height=Number(box.dataset.h)*scale+'px';Object.assign(img.style,{width:1536*scale+'px',height:1024*scale+'px',left:-Number(box.dataset.x)*scale+'px',top:-Number(box.dataset.y)*scale+'px'});});}new ResizeObserver(resize).observe(document.querySelector('main'));document.getElementById('version').onchange=e=>document.querySelectorAll('.painting').forEach(img=>img.src=e.target.value==='vector'?'vector-latest.png':'painting-pass-'+e.target.value+'.png');resize();</script></html>
